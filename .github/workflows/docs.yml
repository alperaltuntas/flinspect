# Build the MkDocs Material manual (manual/ + mkdocs.yml) and deploy it to
# GitHub Pages on pushes to main. The build is fully static: every command
# output shown in the manual is pre-rendered and committed under
# manual/snippets/ (see manual/snippets/render_snippets.sh), so no flang,
# clang, Lean, or dump collection is needed here.
#
# One-time repository setup is required before this deploys — see
# PUBLISHING.md at the repo root.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the docs toolchain
        run: pip install 'mkdocs-material>=9,<10'
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
