# The quickstart manifest — a self-contained toy kernel pair.
#
# How to read it: [fortran] and [cpp] configure each language side once —
# where its sources live, which compiler reads them, and which Lean module
# `groundline kernel generate` writes. Each [[kernel]] then gives one
# kernel's location on each side. Both sides here are standalone files, so
# each side's compiler (flang / clang++) runs on demand.
#
# Run from this directory (the CLI finds ./kernels.toml on its own):
#   groundline kernel list | show NAME | generate | verify
# Relative paths resolve against this file's directory.

[fortran]
sources   = "."
compiler  = "flang"
generated = "../../lean/groundline/Groundline/QuickstartFtn.lean"
namespace = "Quickstart.GeneratedFtn"

[cpp]
sources   = "."
compiler  = "clang++"
generated = "../../lean/groundline/Groundline/QuickstartCpp.lean"
namespace = "Quickstart.GeneratedCpp"

[lean]
# `groundline kernel verify` checks the equivalence theorem here
# (Groundline/QuickstartEquiv.lean) when `lake` is on PATH. This is the
# repository's one Lean project — a Mathlib-backed project is heavy, so the
# example shares it rather than shipping its own; the `generated` modules
# above are written into it so the theorem can import them.
project = "../../lean/groundline"

[[kernel]]
name    = "scale_clip_acc"
fortran = { source = "toy_kernel.f90", subroutine = "scale_clip_acc" }
cpp     = { source = "toy_kernel.cpp", function = "scale_clip_acc_point" }
